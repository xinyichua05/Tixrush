# Runs on every push and pull request. Three checks:
#   backend   - all Spring Boot tests, against throwaway Postgres/Redis/RabbitMQ containers (Testcontainers)
#   frontend  - lint, tests and a production build of the React site
#   docker    - builds the real image, starts the whole system with docker compose, and pokes it
# Render deploys only after all three pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          chmod +x mvnw
          ./mvnw -B verify 2>&1 | tee build.log
      - name: Show failed tests as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, html, re
          # Build errors outside the tests (compile errors, a context that won't start...)
          try:
              errors = [l.strip() for l in open('build.log', encoding='utf-8', errors='replace') if l.startswith('[ERROR]')]
              for line in errors[:12]:
                  print(f"::error title=build::{line[:900].replace('%', '%25')}")
          except FileNotFoundError:
              pass
          for path in glob.glob('target/surefire-reports/TEST-*.xml'):
              text = open(path, encoding='utf-8', errors='replace').read()
              for case in re.finditer(r'<testcase name="([^"]+)" classname="([^"]+)"[^>]*>(.*?)</testcase>', text, re.S):
                  name, cls, body = case.groups()
                  bad = re.search(r'<(failure|error)(?: message="([^"]*)")?[^>]*>(.*?)</\1>', body, re.S)
                  if not bad:
                      continue
                  detail = html.unescape(bad.group(2) or '') + ' | ' + html.unescape(bad.group(3) or '')
                  detail = ' '.join(detail.split())[:900].replace('%', '%25')
                  print(f"::error title={cls.split('.')[-1]}.{name}::{detail}")
          PY
      - name: Keep the test reports if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and start everything
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test
        run: |
          set -e
          curl -fsS http://localhost:8080/actuator/health | grep -q '"UP"'
          echo "health: UP"
          curl -fsS http://localhost:8080/ | grep -q 'id="root"'
          echo "website: served"
          curl -fsS http://localhost:8080/events/1 | grep -q 'id="root"'
          echo "deep link: served by the website"
          curl -fsS http://localhost:8080/api/events | grep -q '^\['
          echo "api: events list answers"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/visualizer/)
          test "$code" = "401" || test "$code" = "403"
          echo "visualizer: hidden ($code)"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/nope)
          test "$code" != "200"
          echo "unknown api path: $code (not the website)"
      - name: Show the app log if something failed
        if: failure()
        run: docker compose logs app
      - name: Stop
        if: always()
        run: docker compose down -v
