# Runs on every push and pull request. Three checks:
#   backend   - all Spring Boot tests, against throwaway Postgres/Redis/RabbitMQ containers (Testcontainers)
#   frontend  - lint, tests and a production build of the React site
#   docker    - builds the real image, starts the whole system with docker compose, and pokes it
# Render deploys only after all three pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          chmod +x mvnw
          ./mvnw -B verify 2>&1 | tee build.log
      - name: Show failed tests as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, html, re
          # GitHub shows at most 10 error notes per step, so: one per distinct problem, root cause first.
          seen, notes = set(), []
          for path in sorted(glob.glob('target/surefire-reports/TEST-*.xml')):
              text = open(path, encoding='utf-8', errors='replace').read()
              for case in re.finditer(r'<testcase ([^>]*)>(.*?)</testcase>', text, re.S):
                  attrs, body = case.groups()
                  bad = re.search(r'<(failure|error)([^>]*)>(.*?)</\1>', body, re.S)
                  if not bad:
                      continue
                  name = re.search(r'name="([^"]*)"', attrs).group(1)
                  cls = re.search(r'classname="([^"]*)"', attrs).group(1).split('.')[-1]
                  message = html.unescape((re.search(r'message="([^"]*)"', bad.group(2)) or [None, ''])[1])
                  trace = html.unescape(bad.group(3))
                  causes = re.findall(r'Caused by: ([^\n]+)', trace)
                  root = causes[-1] if causes else (message or trace.strip().split('\n')[0])
                  if root in seen:
                      continue
                  seen.add(root)
                  notes.append((f'{cls}.{name}', ' '.join(f'{root} || {message}'.split())[:900]))
          for title, detail in notes[:9]:
              print(f"::error title={title}::{detail.replace('%', '%25')}")
          if not notes:  # not a test failure: show the build's own errors (compile errors etc.)
              try:
                  lines = [l.strip() for l in open('build.log', encoding='utf-8', errors='replace') if l.startswith('[ERROR]')]
              except FileNotFoundError:
                  lines = []
              for line in lines[:9]:
                  print(f"::error title=build::{line[:900].replace('%', '%25')}")
          PY
      - name: Keep the test reports if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and start everything
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test
        run: |
          set -e
          curl -fsS http://localhost:8080/actuator/health | grep -q '"UP"'
          echo "health: UP"
          curl -fsS http://localhost:8080/ | grep -q 'id="root"'
          echo "website: served"
          curl -fsS http://localhost:8080/events/1 | grep -q 'id="root"'
          echo "deep link: served by the website"
          curl -fsS http://localhost:8080/api/events | grep -q '^\['
          echo "api: events list answers"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/visualizer/)
          test "$code" = "401" || test "$code" = "403"
          echo "visualizer: hidden ($code)"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/nope)
          test "$code" != "200"
          echo "unknown api path: $code (not the website)"
      - name: Show the app log if something failed
        if: failure()
        run: docker compose logs app
      - name: Stop
        if: always()
        run: docker compose down -v
